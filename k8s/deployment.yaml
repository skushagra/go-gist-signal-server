apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-gist-signal-server
  namespace: go-gist-signal-server
  labels:
    app: go-gist-signal-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: go-gist-signal-server
  template:
    metadata:
      labels:
        app: go-gist-signal-server
    spec:
      containers:
        - name: go-gist-signal-server
          image: ghcr.io/skushagra/go-gist-signal-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: go-gist-signal-server-config
            - secretRef:
                name: go-gist-signal-server-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      imagePullSecrets:
        - name: ghcr-secret
