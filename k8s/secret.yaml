# This is a template - actual secrets should be created via kubectl or GitHub Actions
# DO NOT commit real secrets to this file
apiVersion: v1
kind: Secret
metadata:
  name: go-gist-signal-server-secrets
  namespace: go-gist-signal-server
  labels:
    app: go-gist-signal-server
type: Opaque
stringData:
  # These will be populated from GitHub Secrets during deployment
  KV_URL: "${KV_URL}"
  KV_REST_API_URL: "${KV_REST_API_URL}"
  KV_REST_API_TOKEN: "${KV_REST_API_TOKEN}"
  KV_REST_API_READ_ONLY_TOKEN: "${KV_REST_API_READ_ONLY_TOKEN}"
